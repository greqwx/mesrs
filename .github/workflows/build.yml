name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release --locked

      - name: strip
        if: runner.os != 'Windows'
        run: strip target/release/mesrs

      - name: stage
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/mesrs.exe "dist/mesrs-${{ matrix.name }}.exe"
          else
            cp target/release/mesrs "dist/mesrs-${{ matrix.name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mesrs-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: pack release assets
        run: |
          mkdir -p assets
          for file in dist/*; do
            name=$(basename "$file")
            case "$name" in
              *.exe)
                (cd dist && zip -q "../assets/${name%.exe}.zip" "$name")
                ;;
              *)
                tar -czf "assets/$name.tar.gz" -C dist "$name"
                ;;
            esac
          done

      - name: collect commits
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="$prev..$GITHUB_REF_NAME"
          else
            range="$GITHUB_REF_NAME"
          fi
          git log --pretty=format:'- %s (%h)' "$range" > notes.md
          printf '\n' >> notes.md

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            assets/*
